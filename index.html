<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Bảo tàng Ký ức Nông Tiến</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: a sunny preschool hall: sky page, cloud-white rounded cards, one bright colour per room (coral, sunflower, leaf, sky, lilac) */
:root{
  --paper:#eef7ff; --wall:#fff7dc; --ink:#24304a; --muted:#56637d;
  --indigo:#2f6fc4; --indigo-soft:#dcecff; --turmeric:#9c5f05; --turmeric-fill:#ffc531; --leaf:#34a060;
  --frame:#ffffff; --line:#cfe0f2; --now:#2e9a57; --danger:#cf4237; --red:#e4574b;
  --coral:#ff7466; --lilac:#8c6bd6; --teal:#14a08f; --c:var(--indigo); --shadow:rgba(47,111,196,.18);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12203a; --wall:#1d2c4c; --ink:#eef3ff; --muted:#a9b6d3;
  --indigo:#7db6ff; --indigo-soft:#233a63; --turmeric:#ffd36b; --turmeric-fill:#f2b730; --leaf:#6fd093;
  --frame:#1a2944; --line:#2f4168; --now:#6fd093; --danger:#ff8a80; --red:#ff8a7e;
  --coral:#ff8f82; --lilac:#b9a2f5; --teal:#5fd6c6; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12203a; --wall:#1d2c4c; --ink:#eef3ff; --muted:#a9b6d3;
  --indigo:#7db6ff; --indigo-soft:#233a63; --turmeric:#ffd36b; --turmeric-fill:#f2b730; --leaf:#6fd093;
  --frame:#1a2944; --line:#2f4168; --now:#6fd093; --danger:#ff8a80; --red:#ff8a7e;
  --coral:#ff8f82; --lilac:#b9a2f5; --teal:#5fd6c6; --shadow:rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:800}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:3px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sample{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--turmeric);font-weight:800}
.chip{display:inline-block;font-size:13px;font-weight:800;color:var(--indigo);background:var(--indigo-soft);padding:3px 11px;border-radius:999px;border:0}
.media-dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.media-dots span{font-size:11px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--c) 30%,var(--frame));border-radius:999px;padding:0 8px;line-height:19px}

/* Hero: sky with sun & clouds */
.gate{position:relative;margin-top:16px;border-radius:32px;background:var(--indigo-soft);overflow:hidden;padding-block:34px 30px;padding-inline:clamp(18px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.gate .deco{position:absolute;inset:auto 0 0 0;height:46px;color:var(--leaf);pointer-events:none}
.gate .deco svg{width:100%;height:100%;display:block}
.gate svg.sun{width:clamp(110px,16vw,170px);height:auto;position:relative;z-index:1}
.gate .txt{position:relative;z-index:1;padding-bottom:18px}
.gate .school{font-weight:800;color:var(--indigo);font-size:15px}
.gate h1{font-size:clamp(38px,7vw,68px);color:var(--ink);margin-top:2px;letter-spacing:-.01em}
.gate h1 span{color:var(--coral)}
.gate h1 span+span{color:var(--leaf)}
.gate .motto{font-family:var(--f-hand);font-size:clamp(20px,2.6vw,26px);margin:2px 0 0;color:var(--indigo)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stats span{background:var(--frame);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.stats b{font-family:var(--f-display);font-size:18px;color:var(--paper);background:var(--c);border-radius:999px;min-width:34px;height:30px;display:inline-grid;place-items:center;padding:0 8px;font-variant-numeric:tabular-nums}
.cta{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:800;font-size:16px;text-decoration:none;white-space:nowrap;border:2.5px solid var(--indigo);background:var(--frame);color:var(--indigo);box-shadow:0 4px 0 var(--line);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--indigo);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--indigo) 60%,#000)}
.btn.sun{background:var(--turmeric-fill);border-color:var(--turmeric-fill);color:#3a2a00;box-shadow:0 4px 0 #c9921a}
.btn.small{padding:5px 13px;font-size:14px;box-shadow:0 2px 0 var(--line)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.primary{background:var(--danger);color:var(--paper);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
@media (max-width:620px){.gate{grid-template-columns:1fr}.gate svg.sun{position:absolute;right:-18px;top:-14px;width:110px;opacity:.95}.gate .txt{padding-top:44px}}

/* Room nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.rooms{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1060px;margin:0 auto;padding-bottom:4px}
.rooms button{flex:none;border:2.5px solid var(--c);background:var(--frame);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:15px;font-weight:800;white-space:nowrap}
.rooms button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#1d2638;font-size:12px;margin-right:6px}
.rooms button[aria-selected="true"]{background:color-mix(in srgb,var(--c) 28%,var(--frame));color:var(--ink)}
.rooms button.admin-tab{border-style:dashed;--c:var(--muted)}

/* 3 cột: phòng | nội dung (gấp đôi) | thông tin */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:22px}
.layout.wide{grid-template-columns:minmax(0,1fr) minmax(0,3fr)}
.layout.wide .side-info{display:none}
.layout .room{padding-top:0}
.layout .wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px;padding:22px 18px}
.layout .piece .frame{border-width:5px;border-radius:22px}
.layout .label b{font-size:16px}
.layout .index,.layout .cal,.layout .guide{grid-template-columns:repeat(3,minmax(0,1fr))}
.layout .door{padding:14px 14px 12px}.layout .door b{font-size:19px}
@media (max-width:760px){.layout .index,.layout .cal,.layout .guide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.layout .cal,.layout .guide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.layout .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:18px 12px}}
nav.side-nav{position:sticky;top:max(12px,env(safe-area-inset-top,0px));padding:0;background:none;display:grid;gap:8px;max-height:calc(100vh - 24px);overflow:auto}
.side-nav .rooms{flex-direction:column;overflow:visible;max-width:none;margin:0;padding:0}
.side-nav .rooms button{white-space:normal;text-align:left;display:flex;align-items:center;gap:8px;border-radius:18px;padding:9px 12px;line-height:1.25;width:100%}
.side-nav .rooms button .n{flex:none;margin-right:0}
.side-info{display:grid;gap:16px}
.side-info h3{font-size:20px}
.side-info .stats{margin-top:4px}
.side-info .m{font-weight:800;color:var(--muted);font-size:14px}
.side-info p{margin:0;font-size:15px;color:var(--muted)}
.newlist{display:grid;gap:8px}
.newlist button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 14%,var(--frame));border-radius:14px;padding:6px 8px}
.newlist button:focus-visible{outline:3px solid var(--turmeric-fill)}
.newlist svg,.newlist img{width:44px;height:44px;object-fit:cover;border-radius:10px;color:var(--indigo);display:block}
.newlist b{display:block;font-size:15px;line-height:1.2}
.newlist small{color:var(--muted);font-size:13px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,3fr)}.side-info{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.layout.wide .side-info{display:none}}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr);gap:18px}nav.side-nav{position:static;max-height:none}.side-nav .rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.side-nav .rooms button{font-size:14px;padding:8px 10px}}

/* Room */
.room{padding-top:26px;display:grid;gap:26px}
.room-head{display:grid;gap:6px;max-width:68ch}
.room-head h2{font-size:clamp(30px,4.6vw,42px)}
.room-head h2::after{content:"";display:block;width:64px;height:8px;border-radius:8px;background:var(--c);margin-top:8px}
.room-head p{margin:0;color:var(--muted)}
.room-head .src{font-size:13px;color:var(--muted)}
.wall{background:color-mix(in srgb,var(--c) 12%,var(--frame));border-radius:32px;padding:28px max(16px,3vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px}
.empty{background:var(--wall);border-radius:28px;padding:28px;color:var(--muted);text-align:center;font-weight:700}
h3.sub{font-size:26px}

/* Exhibit */
.piece{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:center}
.piece .frame{background:var(--frame);border:6px solid var(--c);border-radius:28px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 35%,transparent);transition:transform .2s}
.piece:nth-child(odd):hover .frame,.piece:nth-child(odd):focus-visible .frame{transform:translateY(-5px) rotate(-2deg)}
.piece:nth-child(even):hover .frame,.piece:nth-child(even):focus-visible .frame{transform:translateY(-5px) rotate(2deg)}
.piece:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:6px;border-radius:28px}
.piece .frame svg{width:62%;height:auto;color:var(--indigo)}
.label{display:grid;gap:3px;min-width:0}
.label b{font-family:var(--f-display);font-size:19px;line-height:1.2;font-weight:700}
.label span.p{font-size:14px;color:var(--muted)}
@media (max-width:560px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:18px 12px;border-radius:24px}.piece .frame{border-width:5px;border-radius:22px}.label b{font-size:16px}}

/* Phases */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.phases{grid-template-columns:1fr}}
.phase{background:var(--frame);border-radius:var(--r);padding:18px 20px;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 var(--line)}
.phase .d{font-size:14px;font-weight:800;color:var(--indigo);font-variant-numeric:tabular-nums}
.phase h4{font-size:20px}
.phase ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.phase.is-now,.month.is-now{box-shadow:0 0 0 3px var(--now),0 6px 0 var(--line)}
.badge{justify-self:start;font-size:12px;font-weight:800;color:var(--paper);background:var(--now);padding:2px 11px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--muted)}
.badge.next{background:transparent;color:var(--muted);border:2px solid var(--line)}

.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.door{all:unset;cursor:pointer;background:color-mix(in srgb,var(--c) 24%,var(--frame));color:var(--ink);border-top:10px solid var(--c);border-radius:26px 26px 18px 18px;padding:18px 18px 16px;display:grid;gap:2px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .15s;min-height:120px;align-content:end;position:relative;overflow:hidden}
.door::before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.35;right:-24px;top:-34px}
.door:hover{transform:translateY(-3px)}
.door:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:3px}
.door .n{font-size:13px;font-weight:800;color:var(--muted)}
.door b{font-family:var(--f-display);font-size:22px;line-height:1.15}
.door span{font-size:14px;font-weight:700;color:var(--muted)}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 30px;border-left:6px dotted var(--c);display:grid;gap:22px;max-width:760px}
.timeline li{position:relative;background:var(--frame);border-radius:var(--r);padding:16px 20px;display:grid;gap:4px;box-shadow:0 4px 0 var(--line)}
.timeline li::before{content:"";position:absolute;left:-46px;top:16px;width:26px;height:26px;border-radius:50%;background:var(--turmeric-fill);border:4px solid var(--paper)}
.timeline .when{font-size:14px;font-weight:800;color:var(--c)}
.timeline h3{font-size:23px}
.timeline p{margin:0;color:var(--muted)}
.timeline .ref{font-size:13px;color:var(--muted)}
.todo{font-family:var(--f-hand);color:var(--turmeric);font-size:19px;line-height:1.3}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.month{background:var(--frame);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 var(--line);border-top:10px solid var(--mc,var(--c))}
.month .m{display:flex;justify-content:space-between;align-items:center;gap:8px}
.month .m b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.month h4{font-family:var(--f-body);font-size:16px;line-height:1.35}
.month p{margin:0;font-size:14px;color:var(--muted)}

/* Tree */
.tree-room{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.tree-room{grid-template-columns:1fr}}
.tree svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.notes{display:grid;gap:14px}
.note{background:var(--wall);border-radius:18px 18px 18px 4px;padding:14px 18px}
.note:nth-child(2){border-radius:18px 18px 4px 18px;margin-left:24px}
.note q{font-family:var(--f-hand);font-size:22px;line-height:1.35;quotes:"“" "”";display:block}
.note small{color:var(--muted)}

.box{background:var(--frame);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0;box-shadow:0 4px 0 var(--line)}
.box h3{font-size:21px}
.box ol,.box ul{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.box li{margin-bottom:5px}
.box.warn{background:var(--wall);box-shadow:none}
.box p{margin:0;color:var(--muted)}
.guide{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
code{font-size:13px;background:var(--indigo-soft);padding:1px 6px;border-radius:6px;overflow-wrap:anywhere}

/* Admin */
.savebar{position:sticky;bottom:0;z-index:6;background:var(--indigo);color:var(--paper);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:24px;border-radius:22px 22px 0 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.savebar .btn{border-color:var(--paper);color:var(--paper);background:transparent;box-shadow:none}
.savebar .btn.primary{background:var(--turmeric-fill);border-color:var(--turmeric-fill);color:#3a2a00}
.msg{font-size:15px;font-weight:700}
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
@media (max-width:820px){.admin-grid{grid-template-columns:1fr}}
.alist{display:grid;gap:18px}
.agroup h4{font-size:19px;margin-bottom:8px}
.arow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--frame);border-radius:16px;padding:8px 10px;margin-bottom:8px;box-shadow:0 3px 0 var(--line)}
.arow.on{box-shadow:0 0 0 3px var(--indigo)}
.arow svg{width:42px;height:42px;color:var(--indigo)}
.arow b{display:block;font-size:15px;line-height:1.3}
.arow small{color:var(--muted);font-size:12px}
.arow .acts{display:flex;gap:6px}
form.edit{background:var(--frame);border-radius:var(--r);padding:20px 22px;display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);box-shadow:0 4px 0 var(--line)}
@media (max-width:820px){form.edit{position:static}}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:14px;font-weight:800}
.f .hint{font-size:12px;color:var(--muted)}
.f input,.f textarea,.f select{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 11px;width:100%;min-width:0}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--indigo);outline:none}
.f textarea{min-height:84px;resize:vertical}
.f.bad input{border-color:var(--danger)}
.f .err{font-size:12px;color:var(--danger);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.artpick{display:flex;flex-wrap:wrap;gap:6px}
.artpick button{all:unset;cursor:pointer;width:48px;height:48px;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;background:var(--paper)}
.artpick button[aria-pressed="true"]{border:3px solid var(--indigo);background:var(--indigo-soft)}
.artpick button:focus-visible{outline:3px solid var(--turmeric-fill)}
.artpick svg{width:34px;height:34px;color:var(--indigo)}
fieldset{border:2px dashed var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:10px;margin:0;min-width:0}
legend{font-size:14px;font-weight:800;color:var(--indigo);padding:0 6px}
.check{display:flex;gap:8px;align-items:center;font-size:15px}
.checks{display:flex;flex-direction:column;gap:6px}
.pend{background:var(--frame);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line);display:grid;gap:6px}
.pend b{font-size:15px;line-height:1.3}
.pend small{color:var(--muted);font-size:13px}
.pend dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:6px 0 0;font-size:14px}
.pend dt{color:var(--muted);font-weight:700}
.pend dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.pend .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pend input{flex:1 1 180px;min-width:0;font:inherit;font-size:14px;padding:5px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.st{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 10px;color:var(--paper);background:var(--muted)}
.st.pending{background:var(--turmeric);}
.st.approved{background:var(--now)}
.st.rejected{background:var(--danger)}
.st.replaced{background:var(--muted)}
.cfilter{display:grid;gap:8px}
.cfilter .row{display:flex;flex-wrap:wrap;gap:8px}
.cfilter button{border:2px solid var(--c);background:var(--frame);color:var(--ink);border-radius:999px;padding:4px 13px;font-size:14px;font-weight:800}
.cfilter button[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 30%,var(--frame))}
.cfilter button small{color:var(--muted);font-weight:700;margin-left:4px}

.viewer{position:fixed;inset:0;z-index:20;background:rgba(18,32,58,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--frame);width:min(720px,100%);max-height:100%;overflow:auto;border-radius:30px;border:6px solid var(--c);display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;padding:24px}

const DEFAULT_SITES=['Trường chính','Phân hiệu Tràng Đà','Phân hiệu Hương Sen'];
const sitesOf=()=>Array.isArray(data.settings.sites)&&data.settings.sites.length?data.settings.sites:DEFAULT_SITES;
const classesOf=()=>Array.isArray(data.settings.classes)?data.settings.classes:[];
const clsOf=id=>classesOf().find(c=>c.id===id);
/* Một hiện vật có thể thuộc nhiều lớp: e.cls là mảng mã lớp (dữ liệu cũ có thể là chuỗi). */
const clsList=e=>(Array.isArray(e.cls)?e.cls:(e.cls?[e.cls]:[])).filter(id=>clsOf(id));
const clsNames=e=>clsList(e).map(id=>clsOf(id).name);
const inSite=(e,s)=>clsList(e).some(id=>clsOf(id).site===s);
const clsShort=e=>{const n=clsNames(e);return n.length>2?`${n.length} lớp`:n.join(', ')};
const normName=n=>String(n||'').toLowerCase().replace(/\s*[–-]\s*l[ớo]p\b.*$/u,'').replace(/\s+/g,' ').trim();
function dupInfo(d){
 const k=normName(d.name);if(!k)return '';
 const o=data.exhibits.filter(e=>e.id!==d.id&&e.room===d.room&&normName(e.name)===k);
 if(!o.length)return '';
 return `⚠ Phòng này đã có ${o.map(e=>`“${esc(e.name)}”${clsNames(e).length?' ('+esc(clsNames(e).join(', '))+')':' (chưa gắn lớp)'}`).join('; ')}. Nếu là cây của lớp khác thì vẫn lưu được, nên ghi thêm tên lớp vào tên, VD: “Cây hoa hồng – lớp A1”. Nếu là cùng một cây do nhiều lớp chăm, hãy sửa hiện vật cũ và tích thêm lớp.`;
}

function roomItems(r){

 const btn=(attr,on,label,count)=>`<button type="button" ${attr} aria-pressed="${on}">${esc(label)}<small>${count}</small></button>`;

const sess=()=>{try{return JSON.parse(localStorage.getItem(SK))||null}catch(_){return null}};

async function api(path,body,onSlow){
 const s=sess(),t=onSlow?setTimeout(onSlow,4000):0;
 try{
  const r=await fetch(API+path,{method:body===undefined?'GET':'POST',cache:'no-store',
   headers:{...(s?{Authorization:'Bearer '+s.token}:{}),...(body!==undefined?{'Content-Type':'application/json'}:{})},
   body:body===undefined?undefined:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok){if(r.status===401&&path!=='/api/login')expired();throw{status:r.status,msg:j.error||('Máy chủ báo lỗi '+r.status+'. Thử lại sau ít phút.')}}
  return j;
 }catch(e){if(e&&e.status)throw e;throw{status:0,msg:'Không kết nối được máy chủ quản trị. Kiểm tra mạng rồi thử lại.'}}
 finally{clearTimeout(t)}
}

/* Render mất vài phút mới đăng bản mới của data/museum.json. Trang hiện ngay bản trên Render,
   rồi đọc bản mới nhất thẳng từ GitHub (chậm tối đa ~1 phút); nếu khác thì cập nhật lại. */
const GH_DATA='https://api.github.com/repos/nguyenthithuhiensteam/baotangkyucso/contents/data/museum.json?ref=main';
async function freshen(){
 try{
  const r=await fetch(GH_DATA,{headers:{Accept:'application/vnd.github.raw+json'}});
  if(!r.ok)return;
  const j=await r.json();
  if(!j||!Array.isArray(j.exhibits)||canAdmin||dirty||JSON.stringify(j)===JSON.stringify(saved))return;
  saved=j;data=clone(j);heroCta();navTabs();
  if($('viewer').hidden)render();
 }catch(_){}
}

}
async function submitItem(kind,item,beforeId){

 const btn=main.querySelector('form.edit button[type=submit]');if(btn){btn.disabled=true;btn.textContent='Đang gửi…'}
 try{
  const r=await api('/api/submit',{kind,item,beforeId},()=>setMsg(WAKE));
  if(r.status==='published'){adoptLatest(r);setMsg('Đã đăng lên trang. Phụ huynh thấy bản mới sau khoảng 1–2 phút.')}
  else{draft=null;editId=null;pendingList=null;render();setMsg(r.merged?'Đã cập nhật bài đang chờ duyệt (gộp với lần gửi trước, chỉ giữ bản mới nhất).':'Đã gửi. Bài sẽ lên trang sau khi người quản trị duyệt; theo dõi ở thẻ “Bài đã gửi”.')}
 }catch(e){setMsg(e.msg);if(btn){btn.disabled=false;btn.textContent=sendLabel()}}
 finally{busy=false}
}
function wireAdmin(){
 const lf0=$('loginForm');
 if(lf0){lf0.onsubmit=async e=>{e.preventDefault();const username=val('g_user'),password=$('g_pass').value;
  const m=$('loginMsg');
  if(!username||!password){m.textContent='Hãy nhập tên đăng nhập và mật khẩu.';return}
  $('g_go').disabled=true;$('g_go').textContent='Đang đăng nhập…';m.textContent='';
  try{const r=await api('/api/login',{username,password},()=>{m.style.color='var(--muted)';m.textContent=WAKE});

/** Thu nhỏ ảnh (cạnh dài tối đa 1600px), bỏ thông tin vị trí, xuất JPEG dưới ~900 KB. */
async function shrink(file){
 let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
 const W=src.width,H=src.height;let side=1600,q=.82,out='';
 for(let k=0;k<6;k++){const s=Math.min(1,side/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
  if(out.length*.75<900*1024)return out;side=Math.round(side*.8);q=Math.max(.6,q-.06)}
 return out;
}

  const s2=$('saveAll');if(s2){s2.disabled=readOnly;s2.textContent='Lưu lên trang'}}
}
