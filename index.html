<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Bảo tàng Ký ức Nông Tiến</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: a sunny preschool hall: sky page, cloud-white rounded cards, one bright colour per room (coral, sunflower, leaf, sky, lilac) */
:root{
  --paper:#eef7ff; --wall:#fff7dc; --ink:#24304a; --muted:#56637d;
  --indigo:#2f6fc4; --indigo-soft:#dcecff; --turmeric:#9c5f05; --turmeric-fill:#ffc531; --leaf:#34a060;
  --frame:#ffffff; --line:#cfe0f2; --now:#2e9a57; --danger:#cf4237; --red:#e4574b;
  --coral:#ff7466; --lilac:#8c6bd6; --teal:#14a08f; --c:var(--indigo); --shadow:rgba(47,111,196,.18);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12203a; --wall:#1d2c4c; --ink:#eef3ff; --muted:#a9b6d3;
  --indigo:#7db6ff; --indigo-soft:#233a63; --turmeric:#ffd36b; --turmeric-fill:#f2b730; --leaf:#6fd093;
  --frame:#1a2944; --line:#2f4168; --now:#6fd093; --danger:#ff8a80; --red:#ff8a7e;
  --coral:#ff8f82; --lilac:#b9a2f5; --teal:#5fd6c6; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12203a; --wall:#1d2c4c; --ink:#eef3ff; --muted:#a9b6d3;
  --indigo:#7db6ff; --indigo-soft:#233a63; --turmeric:#ffd36b; --turmeric-fill:#f2b730; --leaf:#6fd093;
  --frame:#1a2944; --line:#2f4168; --now:#6fd093; --danger:#ff8a80; --red:#ff8a7e;
  --coral:#ff8f82; --lilac:#b9a2f5; --teal:#5fd6c6; --shadow:rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:800}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:3px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sample{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--turmeric);font-weight:800}
.chip{display:inline-block;font-size:13px;font-weight:800;color:var(--indigo);background:var(--indigo-soft);padding:3px 11px;border-radius:999px;border:0}
.media-dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.media-dots span{font-size:11px;font-weight:800;color:var(--ink);background:color-mix(in srgb,var(--c) 30%,var(--frame));border-radius:999px;padding:0 8px;line-height:19px}

/* Hero: sky with sun & clouds */
.gate{position:relative;margin-top:16px;border-radius:32px;background:var(--indigo-soft);overflow:hidden;padding-block:34px 30px;padding-inline:clamp(18px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.gate .deco{position:absolute;inset:auto 0 0 0;height:46px;color:var(--leaf);pointer-events:none}
.gate .deco svg{width:100%;height:100%;display:block}
.gate svg.sun{width:clamp(110px,16vw,170px);height:auto;position:relative;z-index:1}
.gate .txt{position:relative;z-index:1;padding-bottom:18px}
.gate .school{font-weight:800;color:var(--indigo);font-size:15px}
.gate h1{font-size:clamp(38px,7vw,68px);color:var(--ink);margin-top:2px;letter-spacing:-.01em}
.gate h1 span{color:var(--coral)}
.gate h1 span+span{color:var(--leaf)}
.gate .motto{font-family:var(--f-hand);font-size:clamp(20px,2.6vw,26px);margin:2px 0 0;color:var(--indigo)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.stats span{background:var(--frame);border-radius:999px;padding:4px 14px 4px 6px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--line)}
.stats b{font-family:var(--f-display);font-size:18px;color:var(--paper);background:var(--c);border-radius:999px;min-width:34px;height:30px;display:inline-grid;place-items:center;padding:0 8px;font-variant-numeric:tabular-nums}
.cta{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:800;font-size:16px;text-decoration:none;white-space:nowrap;border:2.5px solid var(--indigo);background:var(--frame);color:var(--indigo);box-shadow:0 4px 0 var(--line);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--indigo);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--indigo) 60%,#000)}
.btn.sun{background:var(--turmeric-fill);border-color:var(--turmeric-fill);color:#3a2a00;box-shadow:0 4px 0 #c9921a}
.btn.small{padding:5px 13px;font-size:14px;box-shadow:0 2px 0 var(--line)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.danger.primary{background:var(--danger);color:var(--paper);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
@media (max-width:620px){.gate{grid-template-columns:1fr}.gate svg.sun{position:absolute;right:-18px;top:-14px;width:110px;opacity:.95}.gate .txt{padding-top:44px}}

/* Ảnh bìa */
.cover{position:relative;margin-top:16px}
.cover img{display:block;width:100%;height:auto;aspect-ratio:1024/434;object-fit:cover;border-radius:28px;background:var(--indigo-soft);box-shadow:0 6px 0 var(--line)}
.cover .cta{position:absolute;left:clamp(14px,3vw,36px);bottom:clamp(12px,2.6vw,30px);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:620px){.cover img{border-radius:18px}.cover .cta{position:static;margin-top:12px}}

/* Room nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.rooms{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:1060px;margin:0 auto;padding-bottom:4px}
.rooms button{flex:none;border:2.5px solid var(--c);background:var(--frame);color:var(--ink);border-radius:999px;padding:6px 16px;font-size:15px;font-weight:800;white-space:nowrap}
.rooms button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:#1d2638;font-size:12px;margin-right:6px}
.rooms button[aria-selected="true"]{background:color-mix(in srgb,var(--c) 28%,var(--frame));color:var(--ink)}
.rooms button.admin-tab{border-style:dashed;--c:var(--muted)}

/* 3 cột: phòng | nội dung (gấp đôi) | thông tin */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:22px}
.layout.wide{grid-template-columns:minmax(0,1fr) minmax(0,3fr)}
.layout.wide .side-info{display:none}
.layout .room{padding-top:0}
.layout .wall{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 16px;padding:22px 18px}
.layout .piece .frame{border-width:5px;border-radius:22px}
.layout .label b{font-size:16px}
.layout .index,.layout .cal,.layout .guide{grid-template-columns:repeat(3,minmax(0,1fr))}
.layout .door{padding:14px 14px 12px}.layout .door b{font-size:19px}
@media (max-width:760px){.layout .index,.layout .cal,.layout .guide{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.layout .cal,.layout .guide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.layout .wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:18px 12px}}
nav.side-nav{position:sticky;top:max(12px,env(safe-area-inset-top,0px));padding:0;background:none;display:grid;gap:8px;max-height:calc(100vh - 24px);overflow:auto}
.side-nav .rooms{flex-direction:column;overflow:visible;max-width:none;margin:0;padding:0}
.side-nav .rooms button{white-space:normal;text-align:left;display:flex;align-items:center;gap:8px;border-radius:18px;padding:9px 12px;line-height:1.25;width:100%}
.side-nav .rooms button .n{flex:none;margin-right:0}
.side-info{display:grid;gap:16px}
.side-info h3{font-size:20px}
.side-info .stats{margin-top:4px}
.side-info .m{font-weight:800;color:var(--muted);font-size:14px}
.side-info p{margin:0;font-size:15px;color:var(--muted)}
.newlist{display:grid;gap:8px}
.newlist button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:color-mix(in srgb,var(--c) 14%,var(--frame));border-radius:14px;padding:6px 8px}
.newlist button:focus-visible{outline:3px solid var(--turmeric-fill)}
.newlist svg,.newlist img{width:44px;height:44px;object-fit:cover;border-radius:10px;color:var(--indigo);display:block}
.newlist b{display:block;font-size:15px;line-height:1.2}
.newlist small{color:var(--muted);font-size:13px}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) minmax(0,3fr)}.side-info{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.layout.wide .side-info{display:none}}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr);gap:18px}nav.side-nav{position:static;max-height:none}.side-nav .rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.side-nav .rooms button{font-size:14px;padding:8px 10px}}

/* Room */
.room{padding-top:26px;display:grid;gap:26px}
.room-head{display:grid;gap:6px;max-width:68ch}
.room-head h2{font-size:clamp(30px,4.6vw,42px)}
.room-head h2::after{content:"";display:block;width:64px;height:8px;border-radius:8px;background:var(--c);margin-top:8px}
.room-head p{margin:0;color:var(--muted)}
.room-head .src{font-size:13px;color:var(--muted)}
.wall{background:color-mix(in srgb,var(--c) 12%,var(--frame));border-radius:32px;padding:28px max(16px,3vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px}
.empty{background:var(--wall);border-radius:28px;padding:28px;color:var(--muted);text-align:center;font-weight:700}
h3.sub{font-size:26px}

/* Exhibit */
.piece{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:center}
.piece .frame{background:var(--frame);border:6px solid var(--c);border-radius:28px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;box-shadow:0 8px 0 color-mix(in srgb,var(--c) 35%,transparent);transition:transform .2s}
.piece:nth-child(odd):hover .frame,.piece:nth-child(odd):focus-visible .frame{transform:translateY(-5px) rotate(-2deg)}
.piece:nth-child(even):hover .frame,.piece:nth-child(even):focus-visible .frame{transform:translateY(-5px) rotate(2deg)}
.piece:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:6px;border-radius:28px}
.piece .frame svg{width:62%;height:auto;color:var(--indigo)}
.label{display:grid;gap:3px;min-width:0}
.label b{font-family:var(--f-display);font-size:19px;line-height:1.2;font-weight:700}
.label span.p{font-size:14px;color:var(--muted)}
@media (max-width:560px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:18px 12px;border-radius:24px}.piece .frame{border-width:5px;border-radius:22px}.label b{font-size:16px}}

/* Phases */
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.phases{grid-template-columns:1fr}}
.phase{background:var(--frame);border-radius:var(--r);padding:18px 20px;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 var(--line)}
.phase .d{font-size:14px;font-weight:800;color:var(--indigo);font-variant-numeric:tabular-nums}
.phase h4{font-size:20px}
.phase ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.phase.is-now,.month.is-now{box-shadow:0 0 0 3px var(--now),0 6px 0 var(--line)}
.badge{justify-self:start;font-size:12px;font-weight:800;color:var(--paper);background:var(--now);padding:2px 11px;border-radius:999px;white-space:nowrap}
.badge.done{background:var(--muted)}
.badge.next{background:transparent;color:var(--muted);border:2px solid var(--line)}

.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.door{all:unset;cursor:pointer;background:color-mix(in srgb,var(--c) 24%,var(--frame));color:var(--ink);border-top:10px solid var(--c);border-radius:26px 26px 18px 18px;padding:18px 18px 16px;display:grid;gap:2px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .15s;min-height:120px;align-content:end;position:relative;overflow:hidden}
.door::before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.35;right:-24px;top:-34px}
.door:hover{transform:translateY(-3px)}
.door:focus-visible{outline:3px solid var(--turmeric-fill);outline-offset:3px}
.door .n{font-size:13px;font-weight:800;color:var(--muted)}
.door b{font-family:var(--f-display);font-size:22px;line-height:1.15}
.door span{font-size:14px;font-weight:700;color:var(--muted)}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 30px;border-left:6px dotted var(--c);display:grid;gap:22px;max-width:760px}
.timeline li{position:relative;background:var(--frame);border-radius:var(--r);padding:16px 20px;display:grid;gap:4px;box-shadow:0 4px 0 var(--line)}
.timeline li::before{content:"";position:absolute;left:-46px;top:16px;width:26px;height:26px;border-radius:50%;background:var(--turmeric-fill);border:4px solid var(--paper)}
.timeline .when{font-size:14px;font-weight:800;color:var(--c)}
.timeline h3{font-size:23px}
.timeline p{margin:0;color:var(--muted)}
.tshow{display:grid;gap:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--indigo) 14%,var(--frame)),color-mix(in srgb,var(--turmeric-fill) 18%,var(--frame)));border-radius:28px;padding:18px;box-shadow:0 6px 0 var(--line);outline:none}
.tstage{position:relative;min-height:300px;display:grid}
.tslide{grid-area:1/1;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:center;background:var(--frame);border-radius:22px;padding:26px 26px 22px;position:relative;overflow:hidden}
.tslide.in{animation:tin .6s ease}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tyear{position:absolute;right:14px;bottom:-18px;font-family:var(--f-display);font-weight:800;font-size:clamp(72px,12vw,130px);line-height:1;color:color-mix(in srgb,var(--indigo) 14%,transparent);pointer-events:none}
.tbody{position:relative;display:grid;gap:8px;max-width:58ch}
.twhen{justify-self:start;font-weight:800;font-size:14px;color:var(--paper);background:var(--indigo);border-radius:999px;padding:3px 12px}
.tslide h3{font-size:clamp(24px,3.2vw,32px)}
.tslide p{margin:0;font-size:17px;color:var(--ink)}
.tslide small{color:var(--muted);font-size:13px}
.tslide.future{background:repeating-linear-gradient(135deg,var(--frame) 0 14px,color-mix(in srgb,var(--turmeric-fill) 10%,var(--frame)) 14px 28px)}
.tslide.future .twhen{background:var(--turmeric);color:var(--paper)}
.tcount{position:absolute;top:14px;right:18px;font-size:13px;font-weight:800;color:var(--muted)}
.tctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tshow{min-width:0}.tstage,.tslide,.trail{min-width:0}
.trail{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding:8px 2px 2px;position:relative}
.tdot{all:unset;cursor:pointer;flex:1 0 56px;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.tdot i{width:14px;height:14px;border-radius:50%;background:var(--frame);border:3px solid var(--indigo)}
.tdot.future i{border-style:dashed;border-color:var(--turmeric)}
.tdot[aria-selected="true"]{color:var(--ink)}.tdot[aria-selected="true"] i{background:var(--turmeric-fill);transform:scale(1.35)}
.tdot:focus-visible{outline:3px solid var(--turmeric-fill);border-radius:8px}
.tbar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--indigo) 15%,transparent);overflow:hidden}.tbar em{display:block;height:100%;width:0;background:var(--indigo);transition:width .12s linear}
.ishow .tslide{border-left:10px solid var(--sc)}.ishow .twhen{background:var(--sc)}.ishow .tyear{color:color-mix(in srgb,var(--sc) 18%,transparent)}
.ishow .tdot i{border-color:var(--sc)}.ishow .tdot span{white-space:nowrap}.ishow .tdot{flex:1 0 74px}
.ishow .tstage{min-height:270px}
.pshow .tstage{min-height:0}
.pshow .tslide{padding:0;aspect-ratio:16/9;border-left:0;background:var(--wall);align-content:end}
.pshow .tbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pshow .tbody{max-width:none;padding:36px 20px 14px;background:linear-gradient(to top,rgba(10,20,40,.9),rgba(10,20,40,.6) 65%,transparent);color:#fff;gap:5px}
.pshow .tslide h3{color:#fff;font-size:clamp(20px,2.6vw,28px);text-shadow:0 1px 2px #0006}
.pshow .tslide p{color:#f1f4fb;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pshow .tslide small{color:#d6deef;font-size:12px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pshow .twhen{color:#fff}
.pshow .tcount{color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:1px 9px}
.pshow .tdot span{font-size:11px}
.pnote{color:var(--muted);font-size:12px}
@media (max-width:560px){.pshow .tslide{aspect-ratio:4/5}.pshow .tslide p{-webkit-line-clamp:4}}
.tlist summary{cursor:pointer;font-weight:800;color:var(--indigo);padding:4px 0}.tlist .timeline{margin-top:12px}
@media (max-width:560px){.tstage{min-height:360px}.tslide{padding:20px 18px 18px}.tslide p{font-size:16px}}
@media (prefers-reduced-motion:reduce){.tslide.in{animation:none}}
.timeline .ref{font-size:13px;color:var(--muted)}
.todo{font-family:var(--f-hand);color:var(--turmeric);font-size:19px;line-height:1.3}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.month{background:var(--frame);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;align-content:start;box-shadow:0 4px 0 var(--line);border-top:10px solid var(--mc,var(--c))}
.month .m{display:flex;justify-content:space-between;align-items:center;gap:8px}
.month .m b{font-family:var(--f-display);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.month h4{font-family:var(--f-body);font-size:16px;line-height:1.35}
.month p{margin:0;font-size:14px;color:var(--muted)}

/* Tree */
.tree-room{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:760px){.tree-room{grid-template-columns:1fr}}
.tree svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.notes{display:grid;gap:14px}
.note{background:var(--wall);border-radius:18px 18px 18px 4px;padding:14px 18px}
.note:nth-child(2){border-radius:18px 18px 4px 18px;margin-left:24px}
.note q{font-family:var(--f-hand);font-size:22px;line-height:1.35;quotes:"“" "”";display:block}
.note small{color:var(--muted)}

.box{background:var(--frame);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;align-content:start;min-width:0;box-shadow:0 4px 0 var(--line)}
.box h3{font-size:21px}
.box ol,.box ul{margin:0;padding-left:20px;color:var(--muted);font-size:15px}

.vthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.phn{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px}
.piece .frame{position:relative}
.phgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:6px}
.phitem{display:grid;gap:4px;justify-items:start}.phitem img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid var(--line);display:block}
.card .big{background:color-mix(in srgb,var(--c) 14%,var(--frame));border-radius:24px;aspect-ratio:1;display:grid;place-items:center}
.card .big svg{width:72%;color:var(--indigo)}
.piece .frame.ph{overflow:hidden}
.piece .frame.ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .big img{width:100%;height:100%;object-fit:cover;border-radius:24px;display:block}
.arow img{width:42px;height:42px;object-fit:cover;border-radius:10px;display:block}
.phprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.phprev img{width:120px;height:120px;object-fit:cover;border-radius:16px;border:3px solid var(--line)}
img[data-pv]{max-width:220px;border-radius:12px;border:3px solid var(--line);display:block;margin-top:6px}
.card h3{font-size:30px;margin-top:4px}
.meta{font-size:13px;color:var(--muted);margin:4px 0 10px}
.story{margin:0 0 12px;font-size:17px}
.ask{background:var(--wall);border-radius:18px;padding:12px 16px;font-size:16px}
.ask b{color:var(--turmeric)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.links .note-d{flex-basis:100%;font-size:12px;color:var(--muted)}
.ctrl{grid-column:1/-1;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:2px dashed var(--line);padding-top:14px}
.ctrl .pos{font-size:14px;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
footer{margin-top:40px;padding-top:16px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Nhận diện lớp từ ô "Người / lớp gửi" khi cô quên tích lớp. */
function guessClass(text, classes) {
  const n = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase()
    .replace(/[–—]/g, '-').replace(/\s*-\s*/g, '-').replace(/[^a-z0-9-]+/g, ' ').trim();
  const t = ' ' + n(text) + ' ';
  if (!t.trim()) return '';
  const site = /huong sen| hs /.test(t) ? 'hs' : /trang da| td /.test(t) ? 'td' : /truong chinh| tc /.test(t) ? 'tc' : '';
  const age = /(^|\D)5-6(\D|$)/.test(t) ? '5-6' : /(^|\D)4-5(\D|$)/.test(t) ? '4-5' : /(^|\D)3-4(\D|$)/.test(t) ? '3-4'
    : /(2[45]-36|nha tre|nhom tre)/.test(t) ? 'nt' : '';
  if (!age) return '';
  const letter = (t.match(/ ([abcd][1-9]?) /) || t.match(/ ([abcd][1-9]?)(?=[ .])/) || [])[1] || '';
  const sOf = c => { const s = n(c.site); return /huong sen/.test(s) ? 'hs' : /trang da/.test(s) ? 'td' : 'tc'; };
  const aOf = c => { const x = ' ' + n(c.name) + ' '; return /5-6/.test(x) ? '5-6' : /4-5/.test(x) ? '4-5' : /3-4/.test(x) ? '3-4' : 'nt'; };
  const lOf = c => ((' ' + n(c.name).replace(/ (trang da|huong sen)$/, '') + ' ').match(/ ([abcd][1-9]?) $/) || [])[1] || '';
  let cand = classes.filter(c => aOf(c) === age);
  // Lớp có chữ + số (A3, B1, C3) chỉ có ở Trường chính
  const effSite = site || (/^[abc][1-9]$/.test(letter) ? 'tc' : '');
  if (effSite) cand = cand.filter(c => sOf(c) === effSite);
  if (letter) { const m = cand.filter(c => lOf(c) === letter); if (m.length) cand = m; }
  return cand.length === 1 ? cand[0].id : '';
}

   if(pg)pg.textContent=`${i+1}–${Math.min(n,i+k)} / ${n}`;prev.disabled=t.scrollLeft<4;next.disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-4};
  prev.onclick=()=>t.scrollBy({left:-t.clientWidth,behavior:'smooth'});next.onclick=()=>t.scrollBy({left:t.clientWidth,behavior:'smooth'});
  t.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});upd();
 });

let tTimer=null;
function initShow(){
 clearInterval(tTimer);tTimer=null;
 const box=$('tshow');if(!box)return;
 const sl=[...box.querySelectorAll('.tslide')],dots=[...box.querySelectorAll('.tdot')],bar=$('tbar'),play=$('tplay');
 const DUR=7000,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let cur=0,on=!still,t0=Date.now(),hold=false;
 const go=i=>{cur=(i+sl.length)%sl.length;sl.forEach((x,k)=>{x.hidden=k!==cur;x.classList.toggle('in',k===cur)});
  dots.forEach((d,k)=>d.setAttribute('aria-selected',k===cur));const tr=dots[cur].parentElement;tr.scrollTo({left:dots[cur].offsetLeft-tr.clientWidth/2+dots[cur].clientWidth/2,behavior:still?'auto':'smooth'});t0=Date.now();if(bar)bar.style.width='0%'};
 const setPlay=v=>{on=v;play.textContent=on?'❚❚ Dừng':'▶ Chạy';play.setAttribute('aria-label',on?'Dừng trình chiếu':'Chạy trình chiếu');t0=Date.now();if(bar)bar.style.width='0%'};
 box.querySelectorAll('[data-tnav]').forEach(b=>b.onclick=()=>{go(cur+ +b.dataset.tnav)});
 dots.forEach(d=>d.onclick=()=>go(+d.dataset.tgo));
 play.onclick=()=>setPlay(!on);
 box.onmouseenter=()=>hold=true;box.onmouseleave=()=>hold=false;
 box.addEventListener('focusin',()=>hold=true);box.addEventListener('focusout',()=>hold=false);
 box.onkeydown=e=>{if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}};
 let sx=null;box.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
 box.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));sx=null},{passive:true});
 setPlay(on);go(0);
 tTimer=setInterval(()=>{if(!document.body.contains(box)){clearInterval(tTimer);return}
  if(!on||hold||document.hidden||!$('viewer').hidden){t0=Date.now()-(bar?parseFloat(bar.style.width||0)/100*DUR:0);return}
  const p=(Date.now()-t0)/DUR;if(bar)bar.style.width=Math.min(100,p*100)+'%';if(p>=1)go(cur+1)},120);
}

async function api(path,body,onSlow){
 const s=sess(),t=onSlow?setTimeout(onSlow,4000):0;
 try{
  const r=await fetch(API+path,{method:body===undefined?'GET':'POST',cache:'no-store',
   headers:{...(s?{Authorization:'Bearer '+s.token}:{}),...(body!==undefined?{'Content-Type':'application/json'}:{})},
   body:body===undefined?undefined:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(_){}
  if(!r.ok){if(r.status===401&&path!=='/api/login')expired();throw{status:r.status,msg:j.error||('Máy chủ báo lỗi '+r.status+'. Thử lại sau ít phút.')}}
  return j;
 }catch(e){if(e&&e.status)throw e;throw{status:0,msg:'Không kết nối được máy chủ quản trị. Kiểm tra mạng rồi thử lại.'}}
 finally{clearTimeout(t)}
}

/* Render mất vài phút mới đăng bản mới của data/museum.json. Trang hiện ngay bản trên Render,
   rồi đọc bản mới nhất thẳng từ GitHub (chậm tối đa ~1 phút); nếu khác thì cập nhật lại. */
const GH_DATA='https://api.github.com/repos/nguyenthithuhiensteam/baotangkyucso/contents/data/museum.json?ref=main';
async function freshen(){
 try{
  const r=await fetch(GH_DATA,{headers:{Accept:'application/vnd.github.raw+json'}});
  if(!r.ok)return;
  const j=await r.json();
  if(!j||!Array.isArray(j.exhibits)||canAdmin||dirty||JSON.stringify(j)===JSON.stringify(saved))return;
  saved=j;data=clone(j);heroCta();navTabs();
  if($('viewer').hidden)render();
 }catch(_){}
}

 main.querySelectorAll('[data-phcover]').forEach(b=>b.onclick=()=>{captureEx();const a=photosOf(draft),[x]=a.splice(+b.dataset.phcover,1);a.unshift(x);draft.photos=a;draft.photo=a[0];render()});

function captureEx(){if(!draft||!$('exForm'))return;Object.assign(draft,{room:val('x_room'),plan:val('x_plan'),name:val('x_name'),era:val('x_era'),from:val('x_from'),story:val('x_story'),ask:val('x_ask'),video:val('x_video'),audio:val('x_audio'),link3d:val('x_link3d'),drive:val('x_drive'),tc:$('x_skkn')?[...document.querySelectorAll('[data-xtc]')].filter(x=>x.checked).map(x=>x.dataset.xtc):tcList(draft),keeper:$('x_keeper')?val('x_keeper'):(draft.keeper||''),her:$('x_her')?val('x_her'):(draft.her||''),cls:$('x_clsbox')?[...document.querySelectorAll('[data-xcls]')].filter(x=>x.checked).map(x=>x.dataset.xcls):clsList(draft),photoAlt:$('x_palt')?val('x_palt'):(draft.photoAlt||''),sample:$('x_sample').checked})}
/** Thu nhỏ ảnh (cạnh dài tối đa 1600px), bỏ thông tin vị trí, xuất JPEG dưới ~900 KB. */
async function shrink(file){
 let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'})}catch{src=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
 const W=src.width,H=src.height;let side=1600,q=.82,out='';
 for(let k=0;k<6;k++){const s=Math.min(1,side/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
  if(out.length*.75<900*1024)return out;side=Math.round(side*.8);q=Math.max(.6,q-.06)}
 return out;
}

/* save bar */
let bar=null,msgText='';
function setMsg(t){msgText=t;renderSaveBar()}
function renderSaveBar(){
 if(!canAdmin){if(bar)bar.hidden=true;return}
 if(!bar){bar=document.createElement('div');bar.className='savebar wrap';root.appendChild(bar)}
 bar.hidden=!dirty&&!msgText;
 bar.innerHTML=`<span class="msg" role="status">${esc(msgText||(dirty?'Có thay đổi chưa lưu. Phụ huynh vẫn thấy bản cũ.':''))}</span>${dirty?`<span style="display:flex;gap:8px"><button type="button" class="btn small" id="undoAll">Bỏ thay đổi</button><button type="button" class="btn small primary" id="saveAll" ${readOnly?'disabled':''}>Lưu lên trang</button></span>`:`<button type="button" class="btn small" id="msgClose">Đóng</button>`}`;
 const mc=$('msgClose');if(mc)mc.onclick=()=>{msgText='';renderSaveBar()};
 const u=$('undoAll');if(u)u.onclick=()=>{data=clone(saved);dirty=false;draft=null;editId=null;msgText='';navTabs();heroCta();render();renderSaveBar()};
 const s=$('saveAll');if(s)s.onclick=save;
}
function buildDoc(){
 const reset=(document.head.querySelector('style')||{}).textContent||':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
 const pageStyle=[...document.querySelectorAll('style')].find(s=>s.textContent.includes('--turmeric-fill'));
 const json=JSON.stringify(data).replace(/</g,'\\u003c');
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
  +'<title>Bảo tàng Ký ức Nông Tiến</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
  +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap">\n'
  +'<style>'+pageStyle.textContent+'</style>\n\n<div id="root"></div>\n\n'
  +'<script type="application/json" id="state">'+json+'</'+'script>\n\n'
  +'<script id="app">'+document.getElementById('app').textContent+'</'+'script>\n</body></html>';
}
async function save(){
 const s=$('saveAll');if(s){s.disabled=true;s.textContent='Đang lưu…'}
 if(mode==='github'){
  try{await apiSave();saved=clone(data);dirty=false;msgText='Đã lưu. Trang công khai cập nhật sau khoảng 1–2 phút.';navTabs();markTab();renderSaveBar()}
  catch(e){setMsg(e.msg||'Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.')}
  return;
 }
 if(!artifactNS){setMsg('Không lưu được ở chế độ xem này.');return}
 try{await artifactNS.publish(buildDoc());dirty=false;msgText='Đã lưu. Trang đang tải lại bản mới.';renderSaveBar()}
 catch(e){const c=e&&e.code;
  if(c==='conflict')setMsg('Có người vừa lưu bản khác. Trang sẽ tải lại bản mới nhất; thao tác vừa rồi chưa được lưu.');
  else if(c==='not_writer'||c==='not_granted'){readOnly=true;setMsg('Tài khoản này chỉ có quyền xem nên không lưu được.');render()}
  else if(c==='too_large')setMsg('Nội dung quá lớn. Hãy rút gọn bớt câu chuyện.');
  else if(c==='rate_limited')setMsg('Lưu quá nhiều lần liên tiếp. Đợi một phút rồi bấm Lưu lại.');
  else setMsg('Chưa lưu được ('+(c||'lỗi kết nối')+'). Thử lại sau ít phút.');
  const s2=$('saveAll');if(s2){s2.disabled=readOnly;s2.textContent='Lưu lên trang'}}
}

const V=$('viewer');let list=[],pos=0,lastFocus=null;
function openViewer(items,i){if(!items.length)return;list=items;pos=i;lastFocus=document.activeElement;show();V.hidden=false;$('vNext').focus()}
/* Phát video, âm thanh ngay trong khung xem: YouTube và Google Drive. */
function embedOf(u){u=String(u||'');if(!okUrl(u))return '';
 let m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0';
 m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/);if(m)return 'https://drive.google.com/file/d/'+m[1]+'/preview';
 m=u.match(/drive\.google\.com\/drive\/(?:u\/\d+\/)?folders\/([\w-]{20,})/);if(m)return 'https://drive.google.com/embeddedfolderview?id='+m[1]+'#grid';
 return ''}
function show(){const e=list[pos];
 {const ev=embedOf(e.video),ea=embedOf(e.audio),fold=x=>/embeddedfolderview/.test(x);$('vVideo').innerHTML=(ev?`<div class="vframe ${fold(ev)?'fold':''}"><iframe src="${ev}" title="Video: ${esc(e.name)}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:'')+(ea&&ea!==ev?`<div class="vframe aud"><iframe src="${ea}" title="Âm thanh: ${esc(e.name)}" loading="lazy" allow="autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`:'')}$('vCard').style.setProperty('--c',e.c||'var(--indigo)');$('vArt').innerHTML=pic(e);
 const P=photosOf(e).filter(pubPhoto);$('vThumbs').innerHTML=P.length>1?P.map((p,i)=>`<button type="button" data-vph="${i}" aria-pressed="${!i}" aria-label="Ảnh ${i+1}/${P.length}">${imgOf(p,'')}</button>`).join(''):'';
 $('vThumbs').querySelectorAll('[data-vph]').forEach(b=>b.onclick=()=>{$('vArt').innerHTML=imgOf(P[+b.dataset.vph],e.photoAlt||e.name);$('vThumbs').querySelectorAll('[data-vph]').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('vPlan').textContent=e.plan||e.roomName;$('vTitle').textContent=e.name;
 $('vMeta').textContent=[e.roomName,e.era,e.from,tcList(e).length?'Tiêu chí '+tcList(e).join(', '):'',e.keeper?'Người giữ chặng: '+e.keeper:'',herOf(e.her)?'Di sản: '+herOf(e.her).name:'',e.sample?'nội dung mẫu':''].filter(Boolean).join(' · ');$('vStory').textContent=e.story;$('vAsk').textContent=e.ask;$('vAsk').parentElement.hidden=!e.ask;
 const L=[[e.video,'▶ Xem video'],[e.audio,'♪ Nghe thuyết minh'],[e.link3d,'Xem phòng 3D'],[e.drive,'Mở thư mục lớp']].filter(([u])=>okUrl(u));
 $('vLinks').innerHTML=L.map(([u,t],i)=>`<a class="btn small ${i===0?'primary':''}" href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join('')+(L.length?'<span class="note-d">Mở ở tab mới.'+(okUrl(e.drive)?' Thư mục Drive chỉ mở được với tài khoản đã được cấp quyền.':'')+'</span>':'');
 $('vPos').textContent=`${pos+1} / ${list.length}`;$('vPrev').disabled=pos===0;$('vNext').textContent=pos===list.length-1?'Kết thúc':'Tiếp →'}
function close(){V.hidden=true;$('vVideo').innerHTML='';if(lastFocus)lastFocus.focus()}
$('vPrev').onclick=()=>{if(pos>0){pos--;show()}};
$('vNext').onclick=()=>{if(pos<list.length-1){pos++;show()}else close()};
$('vClose').onclick=close;V.addEventListener('click',e=>{if(e.target===V)close()});
addEventListener('keydown',e=>{if(V.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowRight')$('vNext').click();if(e.key==='ArrowLeft')$('vPrev').click()});
